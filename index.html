<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WordQuest</title>
    <meta name="apple-mobile-web-app-title" content="WordQuest">
    <meta name="application-name" content="WordQuest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='512' height='512'><rect width='512' height='512' rx='128' fill='%230f172a'/><rect x='32' y='32' width='448' height='448' rx='96' fill='none' stroke='%2338bdf8' stroke-width='16'/><text x='50%' y='68%' font-family='sans-serif' font-weight='900' font-size='320' fill='%2338bdf8' text-anchor='middle'>W</text></svg>">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='512' height='512'><rect width='512' height='512' rx='128' fill='%230f172a'/><text x='50%' y='68%' font-family='sans-serif' font-weight='900' font-size='320' fill='%2338bdf8' text-anchor='middle'>W</text></svg>">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #090d16;
            color: #f8fafc;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4px;
        }

        #game-container {
            width: 100%;
            max-width: 480px;
            height: 98dvh;
            max-height: 860px;
            background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 100%);
            border: 2px solid #334155;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            padding-top: max(8px, env(safe-area-inset-top));
            padding-bottom: max(8px, env(safe-area-inset-bottom));
            position: relative;
            overflow: hidden;
        }

        .top-bar {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(8px);
            padding: 6px 10px;
            border-radius: 16px;
            border: 1px solid #334155;
            z-index: 10;
            flex-shrink: 0;
        }

        .top-bar-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2px;
        }

        .badge {
            font-size: 11px;
            font-weight: 700;
            color: #38bdf8;
            background: rgba(14, 165, 233, 0.15);
            padding: 4px 8px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            white-space: nowrap;
        }

        .difficulty-badge {
            font-size: 11px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .diff-easy { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
        .diff-medium { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
        .diff-hard { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
        .diff-hardest { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid #a855f7; }

        .score-badge {
            font-size: 11px;
            font-weight: 700;
            color: #f59e0b;
            background: rgba(245, 158, 11, 0.15);
            padding: 4px 8px;
            border-radius: 20px;
            border: 1px solid rgba(245, 158, 11, 0.3);
            white-space: nowrap;
        }

        .title-badge {
            font-size: 11px;
            font-weight: 800;
            color: #c084fc;
            background: rgba(168, 85, 247, 0.15);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(168, 85, 247, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
            width: 100%;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
            transition: all 0.3s ease;
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e2e8f0;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-skip-top {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #f87171;
        }

        .btn-hint-top {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: 1px solid #818cf8;
            color: #ffffff;
            font-weight: 700;
        }

        #crossword-container {
            width: 100%;
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin: 2px 0;
            overflow: hidden;
        }

        #crossword-grid {
            display: grid;
            position: relative;
            gap: 2px;
            transition: transform 0.3s ease;
        }

        .tile {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.1), 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .tile.empty {
            visibility: hidden;
            box-shadow: none;
        }

        .tile.unsolved {
            background: #1e293b;
            border: 1px solid #334155;
            color: transparent;
        }

        .tile.solved {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            border: 1px solid #fbbf24;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        .tile.solved-pop {
            animation: popIn 0.4s ease-out;
        }

        .tile.already-highlight {
            animation: alreadyPulse 0.6s ease-in-out;
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%) !important;
            border-color: #7dd3fc !important;
            box-shadow: 0 0 18px rgba(56, 189, 248, 0.9) !important;
            z-index: 50;
        }

        @keyframes alreadyPulse {
            0% { transform: scale(1); }
            25% { transform: scale(1.2) rotate(-3deg); }
            50% { transform: scale(1.2) rotate(3deg); }
            75% { transform: scale(1.1) rotate(-1deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            70% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }

        #preview-container {
            height: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            z-index: 5;
            flex-shrink: 0;
        }

        #word-preview {
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid #38bdf8;
            padding: 2px 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #f8fafc;
            min-width: 90px;
            text-align: center;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
            opacity: 0;
            transform: translateY(3px);
            transition: opacity 0.2s, transform 0.2s;
        }

        #word-preview.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #toast-container {
            height: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            z-index: 5;
            flex-shrink: 0;
        }

        .toast {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 2px 8px;
            border-radius: 8px;
            text-transform: uppercase;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .toast.show { opacity: 1; }
        .toast.correct { background: #10b981; color: #ffffff; }
        .toast.already { background: #f59e0b; color: #ffffff; }
        .toast.wrong { background: #ef4444; color: #ffffff; }
        .toast.info { background: #6366f1; color: #ffffff; }

        #wheel-wrapper {
            position: relative;
            width: 260px;
            height: 260px;
            margin-bottom: max(2px, env(safe-area-inset-bottom));
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        #svg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        #svg-canvas line {
            stroke: #38bdf8;
            stroke-width: 6;
            stroke-linecap: round;
            filter: drop-shadow(0 0 6px #0284c7);
        }

        .wheel-background {
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: rgba(30, 41, 59, 0.55);
            border: 2px solid #334155;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.5);
        }

        .wheel-node {
            position: absolute;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
            font-size: 22px;
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 3;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: transform 0.15s, border-color 0.15s;
        }

        .wheel-node.selected {
            background: linear-gradient(145deg, #0284c7 0%, #0369a1 100%);
            border-color: #38bdf8;
            color: #ffffff;
            transform: scale(1.22);
            box-shadow: 0 0 18px rgba(56, 189, 248, 0.7);
        }

        .flying-tile {
            position: absolute;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            border: 1.5px solid #7dd3fc;
            color: #ffffff;
            font-size: 16px;
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            box-shadow: 0 0 18px rgba(56, 189, 248, 0.8);
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 24px;
            text-align: center;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 24px;
            padding: 28px 20px;
            width: 100%;
            max-width: 340px;
        }

        .modal-title { font-size: 24px; font-weight: 800; color: #f8fafc; margin-bottom: 8px; }
        .modal-subtitle { font-size: 14px; color: #94a3b8; margin-bottom: 20px; line-height: 1.4; }

        .modal-btn-group {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .modal-btn {
            width: 100%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            color: #ffffff;
            padding: 12px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
        }

        .modal-btn-danger { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .modal-btn-cancel { background: linear-gradient(135deg, #475569 0%, #334155 100%); }

        .rank-up-card {
            border-color: #c084fc !important;
            box-shadow: 0 0 30px rgba(192, 132, 252, 0.4);
            animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .rank-up-icon {
            font-size: 48px;
            margin-bottom: 10px;
            animation: pulseGlow 1.5s infinite alternate;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(192, 132, 252, 0.5)); }
            100% { transform: scale(1.15); filter: drop-shadow(0 0 20px rgba(192, 132, 252, 0.9)); }
        }

        #level-start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 150;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #level-start-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .start-card {
            background: #1e293b;
            border: 2px solid #38bdf8;
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
            animation: popIn 0.3s ease-out;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="top-bar">
            <div class="top-bar-row">
                <button class="btn-icon btn-hint-top" id="btn-hint">💡 Hint (-500)</button>
                <div class="difficulty-badge diff-easy" id="diff-badge">EASY</div>
                <div class="score-badge" id="score-badge">SCORE: 0</div>
                <button class="btn-icon btn-skip-top" id="btn-skip">Reveal All</button>
            </div>
            <div class="top-bar-row">
                <div class="badge" id="level-badge">LVL 1</div>
                <div class="title-badge" id="player-title-badge">RANK: 🐣 WORD NOVICE</div>
            </div>
        </div>

        <div id="crossword-container">
            <div id="crossword-grid"></div>
        </div>

        <div id="preview-container">
            <div id="word-preview"></div>
        </div>

        <div id="toast-container">
            <div id="toast" class="toast"></div>
        </div>

        <div id="wheel-wrapper">
            <div class="wheel-background"></div>
            <svg id="svg-canvas"></svg>
        </div>

        <div id="level-start-overlay">
            <div class="start-card">
                <div style="font-size: 13px; color: #94a3b8; font-weight: 700;">STARTING LEVEL</div>
                <div id="start-level-title" style="font-size: 28px; font-weight: 800; color: #f8fafc; margin: 4px 0 12px 0;">LEVEL 1</div>
                <div id="start-diff-tag" class="difficulty-badge diff-easy" style="font-size: 14px; display: inline-block; padding: 8px 16px;">DIFFICULTY: EASY</div>
            </div>
        </div>

        <div class="modal-overlay" id="rank-up-modal">
            <div class="modal-card rank-up-card">
                <div class="rank-up-icon">🌟</div>
                <div class="modal-title" style="color: #c084fc;">RANK UP!</div>
                <div class="modal-subtitle" id="rank-up-subtitle" style="font-size: 16px; font-weight: 700; color: #f8fafc;">You are now an Anagram Ace!</div>
                <button class="modal-btn" id="btn-close-rank-up" style="background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);">AWESOME!</button>
            </div>
        </div>

        <div class="modal-overlay" id="win-modal">
            <div class="modal-card">
                <div class="modal-title">🎉 EXCELLENT!</div>
                <div class="modal-subtitle" id="win-subtitle">Level Completed</div>
                <button class="modal-btn" id="btn-next-level">NEXT LEVEL</button>
            </div>
        </div>

        <div class="modal-overlay" id="skip-confirm-modal">
            <div class="modal-card">
                <div class="modal-title">REVEAL ALL?</div>
                <div class="modal-subtitle">Are you sure you want to reveal all words and skip this level?<br><br><strong style="color: #f87171;">Score Penalty: -5000 points</strong></div>
                <div class="modal-btn-group">
                    <button class="modal-btn modal-btn-cancel" id="btn-cancel-skip">Cancel</button>
                    <button class="modal-btn modal-btn-danger" id="btn-confirm-skip">Reveal All</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* ==================== EXPANDED SEEDS DATABASE (ALL SEEDS HAVE AT LEAST 20 VALID WORDS) ==================== */
        const ANAGRAM_SEEDS = [
            { wheel: ["P", "L", "A", "N", "E", "T"], words: ["PLANET", "PLANE", "PLANT", "PLATE", "PANEL", "LANE", "LEAN", "TALE", "NEAT", "PEAT", "PLEA", "PALE", "LATE", "PAN", "PET", "NET", "PAT", "TAP", "ALE", "APE", "PEN", "ANT", "TEN", "TEA", "EAT", "TAN"] },
            { wheel: ["S", "I", "L", "E", "N", "T"], words: ["SILENT", "LISTEN", "INLET", "TINSEL", "ENLIST", "LENT", "LINE", "LIST", "NEST", "SENT", "TILE", "LIES", "SILT", "SLIT", "TIES", "NET", "SET", "TIN", "LIT", "NIL", "SIT", "TEN", "LIE", "LET"] },
            { wheel: ["C", "A", "S", "T", "L", "E"], words: ["CASTLE", "SCALE", "LACE", "CAST", "TALE", "SEAT", "EAST", "LAST", "CASE", "SEAL", "SALE", "TALES", "LEAST", "CAT", "ACT", "LET", "TEA", "SET", "ACE", "SAT", "SIT", "ALE", "ALT"] },
            { wheel: ["S", "T", "R", "E", "A", "M"], words: ["STREAM", "SMART", "STEAM", "TEAM", "TEAR", "MEAT", "RATE", "REST", "SEAT", "TERM", "SAME", "MATE", "MAT", "TEA", "SEA", "MET", "RAM", "ART", "SET", "RAT", "ARM", "EAT"] },
            { wheel: ["A", "C", "T", "O", "R", "S"], words: ["ACTORS", "ACTOR", "STARS", "COAST", "TACOS", "COAT", "STAR", "CATS", "ACT", "OAR", "RAT", "ART", "COT", "ROT", "SAT", "SOT", "CAR", "SAC", "OATS", "ROST", "ARTS", "TSAR", "SORT", "SCAR"] },
            { wheel: ["B", "A", "N", "K", "E", "R"], words: ["BANKER", "BANK", "BAKE", "BARK", "BARN", "BEAK", "BEAR", "EARN", "NEAR", "RANK", "RAKE", "BAR", "ARK", "RAN", "ARE", "EAR", "KEN", "BARE", "BEAN", "BANE", "BRAE", "KEAN"] },
            { wheel: ["C", "A", "R", "P", "E", "T"], words: ["CARPET", "TRACE", "CRAPE", "PACER", "CAPE", "CART", "PATE", "PEAT", "PEAR", "PART", "PACE", "RACE", "CAT", "ACT", "PET", "PAT", "TAP", "TEA", "EAT", "ACE", "CAR", "ARC", "PAR", "RAP", "PER", "TAR", "RAT"] },
            { wheel: ["C", "R", "A", "F", "T", "S"], words: ["CRAFTS", "CRAFT", "FACTS", "ACTS", "ARTS", "CARS", "CART", "CAST", "CATS", "FACT", "RAFT", "STAR", "ACT", "CAT", "RAT", "ART", "SAT", "FAR", "FAT", "CAR", "ARC", "FAST", "TSAR", "SCAR"] },
            { wheel: ["C", "R", "A", "T", "E", "S"], words: ["CRATES", "CASTER", "CRATE", "REACT", "TRACE", "CARE", "CART", "CASE", "CAST", "CATS", "RACE", "RATE", "SEAT", "STAR", "TARE", "TEAR", "ACT", "CAT", "RAT", "ART", "TEA", "EAT", "SET", "SAT", "ACE", "CAR", "ARC"] },
            { wheel: ["C", "R", "E", "A", "T", "E"], words: ["CREATE", "CRATE", "REACT", "TRACE", "CARET", "CART", "RATE", "TARE", "TEAR", "TREE", "CAT", "ACT", "RAT", "ART", "TEA", "EAT", "ACE", "TEE", "CAR", "ARC", "CATE", "EATER", "RETE"] },
            { wheel: ["D", "A", "N", "C", "E", "R"], words: ["DANCER", "CRANE", "ACNE", "DARE", "DEAR", "EARN", "NEAR", "RACE", "READ", "REND", "CAN", "DEN", "END", "RED", "EAR", "ARE", "RAN", "ACE", "CAR", "ARC", "CANE", "CARD", "CARE", "BREAD"] },
            { wheel: ["D", "E", "A", "L", "E", "R"], words: ["DEALER", "LEADER", "ELDER", "DEAL", "DEAR", "DARE", "DALE", "LEAD", "READ", "REAL", "REEL", "RED", "EAR", "ARE", "LED", "ALE", "LAD", "EEL", "LEE", "LADE", "ERASE", "LARD"] },
            { wheel: ["D", "R", "E", "A", "M", "S"], words: ["DREAMS", "DREAM", "DARES", "DEARS", "DAMES", "READS", "DARE", "DEAR", "DAME", "MADE", "MARS", "READ", "SAME", "SEAM", "RED", "RAM", "ARM", "EAR", "ARE", "SEA", "SAD", "MAD", "DEN", "MADS", "SEAR"] },
            { wheel: ["E", "A", "R", "T", "H", "S"], words: ["EARTHS", "EARTH", "HEART", "HASTE", "SHARE", "ARTS", "EARS", "EAST", "HATE", "HEAR", "HEAT", "RATS", "REST", "SEAT", "STAR", "TEAR", "ART", "RAT", "TEA", "EAT", "SAT", "SET", "ASH", "HAS", "HAT", "EAR", "ARE"] },

        /* Helper function: Checks if a word can be formed strictly from wheel letters (with letter frequency enforcement) */
        function canFormWordFromWheel(word, wheelLetters) {
            const letterCounts = {};
            for (let char of wheelLetters) {
                letterCounts[char] = (letterCounts[char] || 0) + 1;
            }
            for (let char of word) {
                if (!letterCounts[char] || letterCounts[char] <= 0) {
                    return false;
                }
                letterCounts[char]--;
            }
            return true;
        }

        /* ==================== GENERATOR ENGINE ==================== */
        function getRandomDifficulty() {
            const difficulties = ["Easy", "Medium", "Hard", "Hardest"];
            const weights = [0.35, 0.35, 0.20, 0.10];
            let rand = Math.random();
            for (let i = 0; i < weights.length; i++) {
                if (rand < weights[i]) return difficulties[i];
                rand -= weights[i];
            }
            return "Easy";
        }

        function getTargetCountsForDifficulty(difficulty) {
            switch(difficulty) {
                case "Easy": return { l3: 6, l4: 4, l5: 3, l6: 2 };
                case "Medium": return { l3: 4, l4: 5, l5: 4, l6: 3 };
                case "Hard": return { l3: 3, l4: 6, l5: 5, l6: 4 };
                case "Hardest": return { l3: 2, l4: 6, l5: 5, l6: 6 };
                default: return { l3: 6, l4: 4, l5: 3, l6: 2 };
            }
        }

        function filterWordsForDifficulty(allWords, difficulty, wheelLetters) {
            const targets = getTargetCountsForDifficulty(difficulty);
            const wordsByLength = { 3: [], 4: [], 5: [], 6: [] };

            /* Guarantee words only made of wheel letters */
            const validWords = allWords.filter(w => canFormWordFromWheel(w, wheelLetters));

            validWords.forEach(w => {
                const len = Math.min(6, w.length);
                if (len >= 3 && wordsByLength[len]) {
                    wordsByLength[len].push(w);
                }
            });

            const selectedWords = [];
            const lengths = [3, 4, 5, 6];
            
            lengths.forEach(l => {
                const reqCount = targets[`l${l}`];
                const available = shuffleArray([...wordsByLength[l]]);
                selectedWords.push(...available.slice(0, reqCount));
            });

            return selectedWords;
        }

        function generateLevelForDifficulty(difficulty) {
            const maxGridSize = 12;

            let availableIndices = [];
            for (let i = 0; i < ANAGRAM_SEEDS.length; i++) {
                if (i !== lastUsedSeedIndex) availableIndices.push(i);
            }
            const chosenIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
            lastUsedSeedIndex = chosenIndex;

            let seed = ANAGRAM_SEEDS[chosenIndex];
            const wheelLetters = [...seed.wheel];

            let attempts = 0;
            while (attempts < 500) {
                attempts++;
                const gridWidth = maxGridSize;
                const gridHeight = maxGridSize;
                const grid = Array(gridHeight).fill(null).map(() => Array(gridWidth).fill(null));
                const placedWords = [];

                let pool = filterWordsForDifficulty(seed.words, difficulty, wheelLetters);
                if (pool.length < 10) {
                    pool = seed.words.filter(w => canFormWordFromWheel(w, wheelLetters));
                }
                pool.sort((a, b) => b.length - a.length);

                if (pool.length === 0) continue;

                const firstWord = pool[0];
                const startRow = Math.floor(gridHeight / 2);
                const startCol = Math.max(0, Math.floor((gridWidth - firstWord.length) / 2));

                for (let i = 0; i < firstWord.length; i++) {
                    grid[startRow][startCol + i] = firstWord[i];
                }
                placedWords.push({ word: firstWord, row: startRow, col: startCol, dir: "H" });

                for (let wIdx = 1; wIdx < pool.length; wIdx++) {
                    const wordToPlace = pool[wIdx];
                    let placed = false;

                    for (let r = 0; r < gridHeight && !placed; r++) {
                        for (let c = 0; c < gridWidth && !placed; c++) {
                            ["H", "V"].forEach(dir => {
                                if (placed) return;
                                if (canPlaceWordStrict(grid, wordToPlace, r, c, dir, gridWidth, gridHeight)) {
                                    placeWordOnGrid(grid, wordToPlace, r, c, dir);
                                    placedWords.push({ word: wordToPlace, row: r, col: c, dir });
                                    placed = true;
                                }
                            });
                        }
                    }
                }

                if (placedWords.length >= 10) {
                    const cropped = cropGridAndAdjustCoordinates(gridWidth, gridHeight, placedWords);
                    return { difficulty, gridWidth: cropped.width, gridHeight: cropped.height, words: cropped.words, wheelLetters };
                }
            }

            return generateFallbackLevel(difficulty, seed);
        }

        function cropGridAndAdjustCoordinates(origW, origH, words) {
            let minR = origH, maxR = 0, minC = origW, maxC = 0;

            words.forEach(wObj => {
                const { word, row, col, dir } = wObj;
                for (let i = 0; i < word.length; i++) {
                    const r = dir === "V" ? row + i : row;
                    const c = dir === "H" ? col + i : col;
                    minR = Math.min(minR, r);
                    maxR = Math.max(maxR, r);
                    minC = Math.min(minC, c);
                    maxC = Math.max(maxC, c);
                }
            });

            const adjustedWords = words.map(wObj => ({
                ...wObj,
                row: wObj.row - minR,
                col: wObj.col - minC
            }));

            return {
                width: (maxC - minC) + 1,
                height: (maxR - minR) + 1,
                words: adjustedWords
            };
        }

        function canPlaceWordStrict(grid, word, row, col, dir, maxW, maxH) {
            if (dir === "H" && col + word.length > maxW) return false;
            if (dir === "V" && row + word.length > maxH) return false;

            let intersections = 0;

            if (dir === "H") {
                if (col - 1 >= 0 && grid[row][col - 1] !== null) return false;
                if (col + word.length < maxW && grid[row][col + word.length] !== null) return false;
            } else {
                if (row - 1 >= 0 && grid[row - 1][col] !== null) return false;
                if (row + word.length < maxH && grid[row + word.length][col] !== null) return false;
            }

            for (let i = 0; i < word.length; i++) {
                const r = dir === "V" ? row + i : row;
                const c = dir === "H" ? col + i : col;
                const cell = grid[r][c];

                if (cell !== null) {
                    if (cell !== word[i]) return false;
                    intersections++;
                } else {
                    if (dir === "H") {
                        if (r - 1 >= 0 && grid[r - 1][c] !== null) return false;
                        if (r + 1 < maxH && grid[r + 1][c] !== null) return false;
                    } else {
                        if (c - 1 >= 0 && grid[r][c - 1] !== null) return false;
                        if (c + 1 < maxW && grid[r][c + 1] !== null) return false;
                    }
                }
            }

            return intersections >= 1;
        }

        function placeWordOnGrid(grid, word, row, col, dir) {
            for (let i = 0; i < word.length; i++) {
                const r = dir === "V" ? row + i : row;
                const c = dir === "H" ? col + i : col;
                grid[r][c] = word[i];
            }
        }

        function generateFallbackLevel(difficulty, seed) {
            const wheel = seed ? seed.wheel : ["P", "L", "A", "N", "E", "T"];
            const validSeedWords = seed ? seed.words.filter(w => canFormWordFromWheel(w, wheel)) : [];
            
            const fallbackWords = [
                { word: "PLANET", row: 0, col: 0, dir: "H" },
                { word: "LANE",   row: 0, col: 1, dir: "V" },
                { word: "NEAT",   row: 0, col: 3, dir: "V" },

                { word: "TEN",    row: 6, col: 4, dir: "H" }
            ].filter(wObj => canFormWordFromWheel(wObj.word, wheel));

            return { difficulty, gridWidth: 7, gridHeight: 8, wheelLetters: wheel, words: fallbackWords };
        }

        function renderCrosswordGrid() {
            crosswordGrid.innerHTML = '';
            const { gridWidth, gridHeight, words } = currentLevelData;

            const tileSize = Math.max(22, Math.min(32, Math.floor(320 / Math.max(gridWidth, gridHeight))));
            crosswordGrid.style.gridTemplateColumns = `repeat(${gridWidth}, ${tileSize}px)`;
            crosswordGrid.style.gridTemplateRows = `repeat(${gridHeight}, ${tileSize}px)`;

            const matrix = Array(gridHeight).fill(null).map(() => Array(gridWidth).fill(null));

            words.forEach(wObj => {
                const { word, row, col, dir } = wObj;
                for (let i = 0; i < word.length; i++) {
                    const r = dir === "V" ? row + i : row;
                    const c = dir === "H" ? col + i : col;
                    matrix[r][c] = word[i];
                }
            });

            for (let r = 0; r < gridHeight; r++) {
                for (let c = 0; c < gridWidth; c++) {
                    const tile = document.createElement('div');
                    tile.classList.add('tile');
                    tile.style.width = `${tileSize}px`;
                    tile.style.height = `${tileSize}px`;
                    tile.style.fontSize = `${Math.floor(tileSize * 0.55)}px`;
                    tile.dataset.row = r;
                    tile.dataset.col = c;

                    if (matrix[r][c] === null) {
                        tile.classList.add('empty');
                    } else {
                        tile.classList.add('unsolved');
                        tile.textContent = matrix[r][c];

                        const parentWords = words.filter(wObj => {
                            const { word, row, col, dir } = wObj;
                            for (let i = 0; i < word.length; i++) {
                                const wr = dir === "V" ? row + i : row;
                                const wc = dir === "H" ? col + i : col;
                                if (wr === r && wc === c) return true;
                            }
                            return false;
                        });

                        if (parentWords.some(wObj => solvedWords.has(wObj.word))) {
                            tile.classList.remove('unsolved');
                            tile.classList.add('solved');
                        }
                    }
                    crosswordGrid.appendChild(tile);
                }
            }
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function renderWheel() {
            wheelWrapper.querySelectorAll('.wheel-node').forEach(n => n.remove());
            wheelLetters = shuffleArray([...currentLevelData.wheelLetters]);

            const totalNodes = wheelLetters.length;
            const radius = 95;
            const centerX = 130;
            const centerY = 130;

            wheelLetters.forEach((letter, idx) => {
                const angle = (idx * (360 / totalNodes) - 90) * (Math.PI / 180);
                const x = centerX + radius * Math.cos(angle) - 22;
                const y = centerY + radius * Math.sin(angle) - 22;

                const node = document.createElement('div');
                node.classList.add('wheel-node');
                node.textContent = letter;
                node.dataset.index = idx;
                node.style.left = `${x}px`;
                node.style.top = `${y}px`;

                wheelWrapper.appendChild(node);
            });
        }

        }

        function getNodeFromPoint(x, y) {
            const nodes = wheelWrapper.querySelectorAll('.wheel-node');
            for (let node of nodes) {
                const rect = node.getBoundingClientRect();
                if (x >= rect.left - 12 && x <= rect.right + 12 &&
                    y >= rect.top - 12 && y <= rect.bottom + 12) {
                    return parseInt(node.dataset.index);
                }
            }
            return null;
        }

        function handlePointerDown(e) {
            const nodeIdx = getNodeFromPoint(e.clientX, e.clientY);
            if (nodeIdx !== null) {
                isDragging = true;
                selectedNodeIndices = [nodeIdx];
                updateSelectionUI(e.clientX, e.clientY);
            }
        }

        function handlePointerMove(e) {
            if (!isDragging) return;

            const nodeIdx = getNodeFromPoint(e.clientX, e.clientY);
            if (nodeIdx !== null) {
                const prevIdx = selectedNodeIndices[selectedNodeIndices.length - 2];
                if (selectedNodeIndices.length > 1 && nodeIdx === prevIdx) {
                    selectedNodeIndices.pop();
                } else if (!selectedNodeIndices.includes(nodeIdx)) {
                    selectedNodeIndices.push(nodeIdx);
                }
            }
            updateSelectionUI(e.clientX, e.clientY);
        }

        function handlePointerUp() {
            if (!isDragging) return;
            isDragging = false;

            const formedWord = selectedNodeIndices.map(i => wheelLetters[i]).join('');
            validateWord(formedWord);

            selectedNodeIndices = [];
            clearSvgLines();
            previewEl.classList.remove('visible');
            wheelWrapper.querySelectorAll('.wheel-node').forEach(n => n.classList.remove('selected'));
        }

        function updateSelectionUI(cursorX, cursorY) {
            wheelWrapper.querySelectorAll('.wheel-node').forEach((n, idx) => {
                if (selectedNodeIndices.includes(idx)) n.classList.add('selected');
                else n.classList.remove('selected');
            });

            const formedWord = selectedNodeIndices.map(i => wheelLetters[i]).join('');
            if (formedWord.length > 0) {
                previewEl.textContent = formedWord;
                previewEl.classList.add('visible');
            } else {
                previewEl.classList.remove('visible');
            }

            drawSvgLines(cursorX, cursorY);
        }

        function drawSvgLines(cursorX, cursorY) {
            clearSvgLines();
            if (selectedNodeIndices.length === 0) return;

            const wrapperRect = wheelWrapper.getBoundingClientRect();
            const points = selectedNodeIndices.map(idx => {
                const node = wheelWrapper.querySelector(`.wheel-node[data-index="${idx}"]`);
                const rect = node.getBoundingClientRect();
                return {
                    x: rect.left + rect.width / 2 - wrapperRect.left,
                    y: rect.top + rect.height / 2 - wrapperRect.top
                };
            });

            for (let i = 0; i < points.length - 1; i++) {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', points[i].x);
                line.setAttribute('y1', points[i].y);
                line.setAttribute('x2', points[i + 1].x);
                line.setAttribute('y2', points[i + 1].y);
                svgCanvas.appendChild(line);
            }

            if (isDragging) {
                const lastPt = points[points.length - 1];
                const activeLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                activeLine.setAttribute('x1', lastPt.x);
                activeLine.setAttribute('y1', lastPt.y);
                activeLine.setAttribute('x2', cursorX - wrapperRect.left);
                activeLine.setAttribute('y2', cursorY - wrapperRect.top);
                svgCanvas.appendChild(activeLine);
            }
        }

        function clearSvgLines() { svgCanvas.innerHTML = ''; }

        /* ==================== ANIMATIONS ENGINE ==================== */
        function highlightAlreadyFoundWord(targetWordObj) {
            const { word, row, col, dir } = targetWordObj;

            for (let i = 0; i < word.length; i++) {
                const r = dir === "V" ? row + i : row;
                const c = dir === "H" ? col + i : col;
                const targetTile = crosswordGrid.querySelector(`.tile[data-row="${r}"][data-col="${c}"]`);

                if (targetTile) {
                    setTimeout(() => {
                        targetTile.classList.add('already-highlight');
                        setTimeout(() => {
                            targetTile.classList.remove('already-highlight');
                        }, 700);
                    }, i * 50);
                }
            }
        }

        function animateWordToGrid(targetWordObj) {
            const { word, row, col, dir } = targetWordObj;
            const containerRect = gameContainer.getBoundingClientRect();

            for (let i = 0; i < word.length; i++) {
                const nodeIdx = selectedNodeIndices[i];
                let startX, startY;

                if (nodeIdx !== undefined) {
                    const nodeEl = wheelWrapper.querySelector(`.wheel-node[data-index="${nodeIdx}"]`);
                    const nodeRect = nodeEl.getBoundingClientRect();
                    startX = nodeRect.left + nodeRect.width / 2 - 14 - containerRect.left;
                    startY = nodeRect.top + nodeRect.height / 2 - 14 - containerRect.top;
                } else {
                    const wheelRect = wheelWrapper.getBoundingClientRect();
                    startX = wheelRect.left + wheelRect.width / 2 - 14 - containerRect.left;
                    startY = wheelRect.top + wheelRect.height / 2 - 14 - containerRect.top;
                }

                const r = dir === "V" ? row + i : row;
                const c = dir === "H" ? col + i : col;
                const targetTile = crosswordGrid.querySelector(`.tile[data-row="${r}"][data-col="${c}"]`);

                if (!targetTile) continue;

                const targetRect = targetTile.getBoundingClientRect();
                const targetX = targetRect.left - containerRect.left;
                const targetY = targetRect.top - containerRect.top;

                const flyer = document.createElement('div');
                flyer.className = 'flying-tile';
                flyer.textContent = word[i];
                flyer.style.left = `${startX}px`;
                flyer.style.top = `${startY}px`;

                gameContainer.appendChild(flyer);

                setTimeout(() => {
                    flyer.style.left = `${targetX}px`;
                    flyer.style.top = `${targetY}px`;
                }, i * 70);

                setTimeout(() => {
                    flyer.remove();
                    targetTile.classList.remove('unsolved');
                    targetTile.classList.add('solved');
                    targetTile.classList.add('solved-pop');
                    setTimeout(() => targetTile.classList.remove('solved-pop'), 400);
                }, 500 + i * 70);
            }
        }

        /* ==================== VALIDATION & LEVEL PROGRESSION ==================== */
        function calculateWordScore(wordLength) {
            return wordLength * 25 + Math.max(0, (wordLength - 3) * 15);
        }

        function validateWord(word) {
            if (word.length < 3) return;

            /* Ensure user guess is strictly formable from current wheel letters */
            if (!canFormWordFromWheel(word, currentLevelData.wheelLetters)) {
                showToast("TRY AGAIN", "wrong");
                return;
            }

            const targetWordObj = currentLevelData.words.find(w => w.word === word);

            if (targetWordObj) {
                if (solvedWords.has(word)) {
                    showToast("ALREADY FOUND!", "already");
                    highlightAlreadyFoundWord(targetWordObj);
                } else {
                    solvedWords.add(word);
                    score += calculateWordScore(word.length);
                    updateScoreDisplay();
                    saveProgress();
                    showToast("CORRECT!", "correct");
                    
                    animateWordToGrid(targetWordObj);
                    
                    setTimeout(() => {
                        checkLevelCompletion();
                    }, 500 + word.length * 70);
                }
            } else {
                showToast("TRY AGAIN", "wrong");
            }
        }

        function handleHint() {
            score -= 500;
            updateScoreDisplay();

            const unsolvedCells = [];
            currentLevelData.words.forEach(wObj => {
                if (!solvedWords.has(wObj.word)) {
                    const { word, row, col, dir } = wObj;
                    for (let i = 0; i < word.length; i++) {
                        const r = dir === "V" ? row + i : row;
                        const c = dir === "H" ? col + i : col;
                        const tile = crosswordGrid.querySelector(`.tile[data-row="${r}"][data-col="${c}"]`);
                        if (tile && tile.classList.contains('unsolved')) {
                            unsolvedCells.push({ tile, letter: word[i], wordObj: wObj });
                        }
                    }
                }
            });

            if (unsolvedCells.length > 0) {
                const randomPick = unsolvedCells[Math.floor(Math.random() * unsolvedCells.length)];
                randomPick.tile.classList.remove('unsolved');
                randomPick.tile.classList.add('solved');
                randomPick.tile.classList.add('solved-pop');
                setTimeout(() => randomPick.tile.classList.remove('solved-pop'), 400);

                showToast("HINT REVEALED (-500 PTS)", "info");

                currentLevelData.words.forEach(wObj => {
                    if (!solvedWords.has(wObj.word)) {
                        const { word, row, col, dir } = wObj;
                        let fullRevealed = true;
                        for (let i = 0; i < word.length; i++) {
                            const r = dir === "V" ? row + i : row;
                            const c = dir === "H" ? col + i : col;
                            const tile = crosswordGrid.querySelector(`.tile[data-row="${r}"][data-col="${c}"]`);
                            if (tile && tile.classList.contains('unsolved')) {
                                fullRevealed = false;
                                break;
                            }
                        }
                        if (fullRevealed) {
                            solvedWords.add(wObj.word);
                        }
                    }
                });

                saveProgress();
                checkLevelCompletion();
            }
        }

        function executeSkipLevel() {
            score -= 5000;
            updateScoreDisplay();

            currentLevelData.words.forEach(wObj => {
                solvedWords.add(wObj.word);
                const { word, row, col, dir } = wObj;
                for (let i = 0; i < word.length; i++) {
                    const r = dir === "V" ? row + i : row;
                    const c = dir === "H" ? col + i : col;
                    const tile = crosswordGrid.querySelector(`.tile[data-row="${r}"][data-col="${c}"]`);
                    if (tile && tile.classList.contains('unsolved')) {
                        tile.classList.remove('unsolved');
                        tile.classList.add('solved');
                        tile.classList.add('solved-pop');
                    }
                }
            });

            showToast("SKIPPED (-5000 PTS)", "wrong");
            saveProgress();

            setTimeout(() => {
                checkLevelCompletion();
            }, 600);
        }

        function checkLevelCompletion() {
            const unsolvedTile = crosswordGrid.querySelector('.tile.unsolved');
            const allWordsSolved = currentLevelData.words.every(wObj => solvedWords.has(wObj.word));

            if (!unsolvedTile || allWordsSolved) {
                currentLevelData.words.forEach(wObj => solvedWords.add(wObj.word));
                saveProgress();

                setTimeout(() => {
                    document.getElementById('win-subtitle').textContent = `Final Score: ${score}\nRank: ${getTitleForScore(score)}`;
                    winModal.classList.add('active');
                }, 600);
            }
        }

        function showToast(msg, type) {
            clearTimeout(toastTimeout);
            toastEl.textContent = msg;
            toastEl.className = `toast ${type} show`;
            toastTimeout = setTimeout(() => toastEl.classList.remove('show'), 1800);
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
